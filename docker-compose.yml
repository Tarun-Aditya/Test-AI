# docker compose up --build          -> hub on http://localhost:8000 plus one agent
# docker compose up --scale agent=3  -> three agents (each registers with its container hostname), 2 slots each
services:
  hub:
    build: .
    command: hub
    ports: ["8000:8000"]
    environment:
      AIAUTO_AGENT_TOKEN: ${AIAUTO_AGENT_TOKEN:-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # your subscription inside Docker (image built with --build-arg AI_CLIS=1):
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}     # from `claude setup-token`
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}           # GitHub token allowed to use Copilot
    volumes: ["autopilot-data:/data"]
  agent:
    build: .
    command: ["agent", "--server", "http://hub:8000", "--token", "${AIAUTO_AGENT_TOKEN:-change-me}", "--slots", "${AGENT_SLOTS:-2}"]
    shm_size: 2gb            # Chromium needs more than Docker's default 64 MB /dev/shm (~1 GB per slot)
    depends_on: [hub]
    restart: unless-stopped
volumes:
  autopilot-data:
