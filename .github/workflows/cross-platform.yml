# Real Windows and macOS (and Linux) machines: every engine x browser the runner has, the generated scripts,
# headed mode, remote agents with parallel slots, and cancel.
#   Windows: Chromium, Chrome, Edge, Firefox (Playwright + Selenium), WebKit (Playwright)
#   macOS:   the same plus Safari through Selenium (safaridriver)
name: cross-platform browsers
on:
  push:
    paths: ["aiauto/**", "tests/**", "requirements.txt", "setup.sh", "setup.bat", "start.sh", "start.bat", "agent.sh", "agent.bat",
            "extension/**", "tools/build_extension.py", ".github/workflows/cross-platform.yml"]
  workflow_dispatch:

jobs:
  browsers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pytest pillow
      - name: Playwright browsers
        if: runner.os != 'Linux'
        run: python -m playwright install chromium firefox webkit
      - name: Playwright browsers (with system libraries)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Enable Safari WebDriver
        if: runner.os == 'macOS'
        run: sudo safaridriver --enable
      - name: Browser matrix (engine x browser, generated scripts, headed)
        run: python -m pytest -q tests/test_browsers.py -rs
      - name: Remote agents, parallel slots, grids, cancel
        run: python -m pytest -q tests/test_agent.py -rs
      - name: Unit tests
        run: python -m pytest -q tests/test_parsing.py tests/test_llm.py tests/test_narrative.py -rs
      - name: Chrome extension (generated files up to date, real Chromium with the extension loaded)
        run: |
          python tools/build_extension.py --check
          python -m pytest -q tests/test_extension.py tests/test_recorder.py tests/test_extension_server.py tests/test_extension_recorder_scripts.py tests/test_extension_complex.py tests/test_extension_check_replay.py tests/test_replay_strategy.py tests/test_extension_ux.py tests/test_run_controls.py -rs

  # The one-step setup a new user runs (setup.sh / setup.bat), the demo data and the hub starting with it
  setup-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: setup.bat --demo
        if: runner.os == 'Windows'
        shell: cmd
        run: call setup.bat --demo
      - name: setup.sh, then demo data
        if: runner.os != 'Windows'
        run: |
          ./setup.sh
          if [ "$RUNNER_OS" = "Linux" ]; then sudo .venv/bin/python -m playwright install-deps chromium; fi
          .venv/bin/python -m aiauto demo
      - name: The demo database is complete
        shell: bash
        run: |
          py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe
          "$py" - <<'PY'
          import sqlite3
          c = sqlite3.connect("aiauto.db")
          q = lambda s: c.execute(s).fetchall()
          print(q("SELECT status, COUNT(*) FROM runs GROUP BY status"))
          assert q("SELECT COUNT(*) FROM users")[0][0] == 3
          assert q("SELECT COUNT(*) FROM runs WHERE status IN ('queued', 'dispatched', 'running')")[0][0] == 0
          assert q("SELECT COUNT(*) FROM runs WHERE status = 'passed'")[0][0] >= 10
          assert q("SELECT COUNT(*) FROM library")[0][0] == 2
          assert q("SELECT COUNT(*) FROM report_failures")[0][0] >= 1      # the planted sign-up bug
          PY
      - name: start.sh / start.bat serves the web app and the practice pages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then (cmd //c start.bat > hub.log 2>&1 &); else (./start.sh > hub.log 2>&1 &); fi
          for i in $(seq 1 60); do curl -fs http://localhost:8000/api/health && break; sleep 1; done
          curl -fs http://localhost:8000/api/health
          curl -fs http://localhost:8000/demo/shop/index.html | grep -q "<html"
          curl -fs -c jar -H "X-Requested-With: autopilot" -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"autopilot-demo"}' http://localhost:8000/api/auth/login
          curl -fs -b jar http://localhost:8000/api/stats
      - name: agent.sh / agent.bat with agent.env joins the hub
        shell: bash
        run: |
          py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe
          "$py" - <<'PY'
          import httpx
          c = httpx.Client(base_url="http://localhost:8000", headers={"X-Requested-With": "autopilot"})
          c.post("/api/auth/login", json={"username": "admin", "password": "autopilot-demo"}).raise_for_status()
          tok = c.post("/api/agent-tokens", json={"label": "ci-agent"}).json()["token"]
          open("agent.env", "w").write(f"AIAUTO_SERVER=http://localhost:8000\nAIAUTO_AGENT_TOKEN={tok}\nAGENT_NAME=ci-agent\nAIAUTO_SLOTS=1\n")
          PY
          if [ "$RUNNER_OS" = "Windows" ]; then (cmd //c agent.bat > agent.log 2>&1 &); else (./agent.sh > agent.log 2>&1 &); fi
          "$py" - <<'PY'
          import httpx, time
          c = httpx.Client(base_url="http://localhost:8000", headers={"X-Requested-With": "autopilot"})
          c.post("/api/auth/login", json={"username": "admin", "password": "autopilot-demo"}).raise_for_status()
          for _ in range(60):
              a = {m["name"]: m for m in c.get("/api/agents").json()}
              if a.get("ci-agent", {}).get("online"):
                  print("agent online:", a["ci-agent"]["platform"], a["ci-agent"]["slots"], "slot(s)")
                  break
              time.sleep(1)
          else:
              print(open("agent.log").read()); raise SystemExit("agent did not connect")
          PY
